[project]
name = "meshfixer"
version = "0.1.0"
description = "Cross-platform mesh repair tool for STL and 3MF files"
license = { text = "GPL-3.0" }
requires-python = ">=3.12"
dependencies = [
    "pymeshlab>=2023.12",
    "PySide6>=6.7",
    "trimesh>=4.0",
]

[project.scripts]
meshfixer = "meshfixer.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
]
